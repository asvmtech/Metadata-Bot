# render.yaml
# IMPORTANT: Create this service as a Background Worker, NOT a Web Service.
# Render Dashboard → New → Background Worker → Connect your GitHub repository.

services:
  - type: worker
    name: video-metadata-editor-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAX_FILE_MB
        value: "1800"
